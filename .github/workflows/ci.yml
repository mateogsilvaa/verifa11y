name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Reproducible install: lockfile only, exact engine versions.
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm test
      - run: node packages/cli/dist/cli.js --version

  bench:
    name: offline benchmark (tier 0)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run build
      - run: node packages/cli/dist/cli.js bench --corpus corpus --mode codemod --report bench/run/report.md --out bench/run
      # Breaking the corpus or the tier-0 promise fails CI.
      - name: Tier 0 must stay at 100% precision
        run: |
          node -e '
            const m = require("./bench/run/metrics.json").byTier["0"];
            console.log(`tier 0: ${m.verified}/${m.proposed} verified`);
            if (m.proposed === 0 || m.verified !== m.proposed) process.exit(1);
          '
      # Rendering differs slightly across platforms, so a mismatch is a warning, not a failure.
      - name: Compare with the committed benchmark
        run: |
          node -e '
            const a = require("./bench/run/metrics.json"), b = require("./bench/codemod/metrics.json");
            const pick = (m) => JSON.stringify({ ...m.overall, usage: 0 });
            if (pick(a) !== pick(b)) console.log("::warning::benchmark differs from bench/codemod/metrics.json; re-run npm run bench:codemod and commit if this is intended");
            else console.log("matches the committed benchmark");
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-codemod
          path: bench/run/

  action:
    name: GitHub Action (smoke)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installs and runs action.yml from this checkout. The filter matches no file, so it never posts a review
      # (the corpus is full of deliberate violations); posting is covered by packages/action/test.
      - uses: ./
        id: verifa11y
        with:
          paths: verifa11y-ci-smoke-matches-nothing/**/*.html
          fail-on: unfixed
      - name: The action ran and reported
        run: test "${{ steps.verifa11y.outputs.findings }}" = "0" && test -f "${{ steps.verifa11y.outputs.results }}"

  docker:
    name: container sandbox
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t verifa11y .
      # File mode must work with no network at all, read-only root, no capabilities, CPU and memory caps.
      - name: Audit and fix offline in the sandbox
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network none --cpus 2 --memory 2g --read-only \
            --tmpfs /tmp --tmpfs /home/verifa11y --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/corpus:/work:ro" -v "$PWD/out:/out" \
            verifa11y audit handwritten/02-newsletter-labels.html --out /out/findings.json
          docker run --rm --network none --cpus 2 --memory 2g --read-only \
            --tmpfs /tmp --tmpfs /home/verifa11y --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/corpus:/work:ro" -v "$PWD/out:/out" \
            verifa11y fix /out/findings.json --verify --mode codemod --out /out/patches
          test -s out/patches/verifa11y.patch
